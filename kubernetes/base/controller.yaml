apiVersion: v1
kind: Service
metadata:
  name: darwinsim-controller
  namespace: darwinsim
spec:
  selector:
    app: darwinsim-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: darwinsim-controller
  namespace: darwinsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: darwinsim-controller
  template:
    metadata:
      labels:
        app: darwinsim-controller
    spec:
      containers:
        - name: controller
          image: ghcr.io/replace-me/darwinsim-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["/src/build/darwinsim-controller"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DARWINSIM_CONFIG
              value: /etc/darwinsim/default.yaml
            - name: DARWINSIM_DATA_DIR
              value: /var/lib/darwinsim
            - name: DARWINSIM_WORKER_COUNT
              value: "1"
            - name: DARWINSIM_WORKER_SERVICE
              value: darwinsim-worker
            - name: DARWINSIM_TICK_SLEEP_MS
              value: "5"
          volumeMounts:
            - name: config
              mountPath: /etc/darwinsim
              readOnly: true
            - name: data
              mountPath: /var/lib/darwinsim
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 700m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: darwinsim-config
        - name: data
          persistentVolumeClaim:
            claimName: darwinsim-data
